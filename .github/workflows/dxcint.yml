name: dxCint Unit Tests
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - ready_for_review
      - labeled
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  packages: read
jobs:
  test:
    name: dxCint Tests (Staging)
    if: contains(github.event.pull_request.labels.*.name, 'dxcint') ||  github.event_name == 'workflow_dispatch' 
    runs-on: ubuntu-24.04
    env:
      PROJECT: dxCompiler_playground
      TEST_DIR: dxcint_testing
    steps:
      - name: Git checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # performance optimizations https://abbbi.github.io/actions/
      - uses: abbbi/github-actions-tune@81fb919e588c20b7ab52b2cac097d2efd765c714 # v1
      - name: Install java
        uses: actions/setup-java@d202f5dbf7256730fb690ec59f6381650114feb2 # v1.4.3
        with:
          java-version: 11

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 1.4.2
          virtualenvs-create: true

      - name: Install dependencies and dxcint
        run: |
          cd dxcint
          poetry install --with dev
          cd ..
          pip3 install dxpy==0.391.0 pytest

      - name: Run dxCint self tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROBOT_TOKEN: ${{ secrets.DX_STAGING_ROBOT_TOKEN }}
        run: |
          export PATH="$PATH:$HOME/.local/bin"

          # Set up DNAnexus staging environment
          dx login --noprojects --staging --token $ROBOT_TOKEN
          dx select $PROJECT
          cd ${GITHUB_WORKSPACE}

          # Run integration tests
          cd dxcint
          poetry run pytest -v
